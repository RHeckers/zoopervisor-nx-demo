<zoo-card>
  <zoo-stack>
    <h4>{{ heading() }}</h4>
    <zoo-photo-upload-field
      [count]="files().length"
      (files)="onFiles($event)"
    />
    @if (files().length === 0) {
      <zoo-empty-state />
    } @else if (visible().length === 0) {
      <zoo-empty-state message="No photos match the filter" />
    } @else {
      <zoo-photo-thumbs
        [files]="visible()"
        [removable]="true"
        (removed)="removeFile($event)"
      />
    }
  </zoo-stack>
</zoo-card>
