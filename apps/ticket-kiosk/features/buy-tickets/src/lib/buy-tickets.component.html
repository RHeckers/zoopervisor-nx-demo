<zoo-stack>
  <zoo-ticket-picker
    [tickets]="tickets.catalog()"
    (pick)="tickets.add($event)"
  />
  <p>Total: {{ (tickets.totalCents() / 100).toFixed(2) }}</p>
  <zoo-button (pressed)="checkout()">Pay</zoo-button>
  @if (tickets.lastReference(); as ref) {
    <p>Paid — reference {{ ref }}</p>
  }
</zoo-stack>
