<zoo-card>
  <zoo-stack>
    <h3>Day tickets</h3>
    <zoo-ticket-picker
      [tickets]="tickets.catalog()"
      (pick)="tickets.add($event)"
    />
    <p class="tickets-total">
      Total: € {{ (tickets.totalCents() / 100).toFixed(2) }}
    </p>
    <zoo-button (pressed)="checkout()">Pay online</zoo-button>
    @if (tickets.lastReference(); as ref) {
      <p class="tickets-paid">Paid — reference {{ ref }}</p>
    }
  </zoo-stack>
</zoo-card>
