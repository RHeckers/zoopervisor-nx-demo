<!-- Both blocks below are self-wiring DOMAIN slices (libs/animals/slices):
     the selected animal at a glance and today's due health checks. They also
     appear on the feeding-rounds page — written once, zero wiring anywhere. -->
@if (facade.vm().selectedId; as id) {
  <zoo-animal-status-slice [animalId]="id" />
}
<zoo-health-due-slice />

@for (a of facade.vm().animals; track a.id) {
  <zoo-animal-card [animal]="a" />
}
<!-- same shared domain component; here the camera implementation resolves. -->
<zoo-incident-report-form />
<!-- app UI panel: the SAME photo organism visitor uses — zero duplication;
     the injector supplies the camera here. -->
<zoo-keeper-report-panel [animalName]="facade.vm().selected?.name ?? ''" />
<zoo-bottom-sheet>
  <zoo-touch-button (tapped)="facade.open('a1')"
    >Reload rounds</zoo-touch-button
  >
  <p>
    {{ facade.vm().schedules.length }} feeding(s),
    {{ facade.vm().records.length }} record(s)
  </p>
</zoo-bottom-sheet>
